spring.application.name=Rede Frio SOA
server.port=8080

# H2 persistente em arquivo: os dados permanecem após reiniciar a aplicação.
# Diretório data/ já incluído no repositório.
spring.datasource.url=jdbc:h2:file:./data/redefrio
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O Flyway cria/altera as tabelas; Hibernate apenas verifica o esquema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.deserialization.fail-on-unknown-properties=true
